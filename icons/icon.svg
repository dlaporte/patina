<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Patina: a copper disc mid-oxidation. Verdigris creeps from the upper-left;
       satellite spots hint at the spread. Master file — export 16/32/48/128 PNGs. -->
  <defs>
    <radialGradient id="copper" cx="42%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#d98e4a"/>
      <stop offset="55%" stop-color="#b87333"/>
      <stop offset="100%" stop-color="#8a5426"/>
    </radialGradient>
    <linearGradient id="verdigris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fdccb"/>
      <stop offset="50%" stop-color="#43b3a0"/>
      <stop offset="100%" stop-color="#2e8f80"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="64" cy="64" r="58"/></clipPath>
  </defs>

  <circle cx="64" cy="64" r="58" fill="url(#copper)"/>

  <g clip-path="url(#disc)">
    <!-- main verdigris front with an irregular, creeping edge -->
    <path fill="url(#verdigris)" d="M -6 -6 L 78 -6
      C 62 8 80 18 66 30
      C 52 42 70 50 56 62
      C 42 74 58 84 44 96
      C 32 106 40 118 26 134
      L -6 134 Z"/>
    <!-- oxidation spots ahead of the front -->
    <circle cx="88" cy="26" r="7" fill="#43b3a0" opacity="0.9"/>
    <circle cx="99" cy="45" r="4" fill="#5fc4b2" opacity="0.85"/>
    <circle cx="78" cy="50" r="3" fill="#2e8f80" opacity="0.8"/>
    <circle cx="60" cy="88" r="3.5" fill="#43b3a0" opacity="0.75"/>
    <!-- soft highlight to keep the disc reading as metal -->
    <ellipse cx="86" cy="42" rx="26" ry="18" fill="#ffffff" opacity="0.10"/>
  </g>

  <circle cx="64" cy="64" r="58" fill="none" stroke="#6f4320" stroke-width="4"/>
</svg>
