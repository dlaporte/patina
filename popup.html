<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header class="plate">
    <img src="icons/icon32.png" alt="" width="26" height="26">
    <h1>Patina</h1>
    <label class="power" title="Patina on/off">
      <input type="checkbox" id="enabled" aria-label="Patina enabled">
      <span class="power-track"><span class="power-thumb"></span></span>
    </label>
  </header>

  <main>
    <section class="site-card">
      <div id="site" class="site"></div>
      <div id="statusRow" class="status" data-state="idle">
        <span class="dot" aria-hidden="true"></span>
        <span id="status"></span>
      </div>
    </section>

    <label class="field">

      <span class="select-wrap">
        <select id="aesthetic" aria-label="Patina"></select>
      </span>
    </label>

    <div class="actions">
      <div class="apply-row">
        <button id="repatinate" class="btn primary" disabled>Apply Patina</button>
        <button id="regenerate" class="btn primary icon" disabled
          title="Regenerate this patina for this site (replaces the cached theme)"
          aria-label="Regenerate theme">&#8635;</button>
      </div>
      <button id="toggleSite" class="btn ghost" disabled>Disable on this site</button>
    </div>

    <div id="error" class="error" hidden></div>
  </main>

  <footer>
    <span class="version">v0.1.1</span>
    <button id="openOptions" class="btn ghost small">Options</button>
  </footer>

  <script src="common/settings.js"></script>
  <script src="common/presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
